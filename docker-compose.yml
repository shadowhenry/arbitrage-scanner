name: arbitrage-scanner-local

x-app: &app
  image: arbitrage-scanner-app:local
  build:
    context: .
    target: application
  env_file:
    - .env
  environment:
    NODE_ENV: development
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    DATABASE_URL: postgresql://${POSTGRES_USER:-arbitrage}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-arbitrage_scanner}
    REDIS_URL: redis://redis:6379
  restart: unless-stopped
  init: true
  depends_on:
    postgres: { condition: service_healthy }
    redis: { condition: service_healthy }
  networks:
    - backend

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-arbitrage_scanner}
      POSTGRES_USER: ${POSTGRES_USER:-arbitrage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    networks:
      - backend

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks:
      - backend

  collector:
    <<: *app
    command: ["pnpm", "--filter", "@arbitrage-scanner/collector", "start:prod"]
    environment:
      NODE_ENV: development
      HEALTH_PORT: "3001"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-arbitrage}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-arbitrage_scanner}
      REDIS_URL: redis://redis:6379
    ports:
      - "${COLLECTOR_HEALTH_PORT:-3001}:3001"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  scanner:
    <<: *app
    command: ["pnpm", "--filter", "@arbitrage-scanner/scanner", "start:prod"]
    environment:
      NODE_ENV: development
      HEALTH_PORT: "3002"
      API_URL: http://api:3000
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-arbitrage}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-arbitrage_scanner}
      REDIS_URL: redis://redis:6379
    ports:
      - "${SCANNER_HEALTH_PORT:-3002}:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 60s

  simulator:
    <<: *app
    command: ["pnpm", "--filter", "@arbitrage-scanner/simulator", "start:prod"]
    environment:
      NODE_ENV: development
      HEALTH_PORT: "3003"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-arbitrage}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-arbitrage_scanner}
      REDIS_URL: redis://redis:6379
    ports:
      - "${SIMULATOR_HEALTH_PORT:-3003}:3003"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    <<: *app
    command: ["pnpm", "--filter", "@arbitrage-scanner/api", "start"]
    environment:
      NODE_ENV: development
      API_HOST: 0.0.0.0
      API_PORT: "3000"
      MOCK_FEED: ${MOCK_FEED:-1}
      MOCK_FEED_INTERVAL_MS: ${MOCK_FEED_INTERVAL_MS:-3000}
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      DATABASE_URL: postgresql://${POSTGRES_USER:-arbitrage}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-arbitrage_scanner}
      REDIS_URL: redis://redis:6379
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  dashboard:
    image: node:22-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable && pnpm --filter @arbitrage-scanner/dashboard dev --host 0.0.0.0 --port 5173"]
    volumes:
      - .:/app
    environment:
      NODE_ENV: development
      API_TARGET: http://api:3000
      VITE_WS_URL: ws://localhost:${DASHBOARD_PORT:-5173}/ws
    ports:
      - "${DASHBOARD_PORT:-5173}:5173"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    init: true
    networks:
      - backend

networks:
  backend:

volumes:
  postgres-data:
  redis-data:
